name: Generate Changelog

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v3
        with:
          args: --version

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v3
        with:
          args: --config cliff.toml --tag ${{ github.ref_name }} --output CHANGELOG.md
