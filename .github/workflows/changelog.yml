name: Generate Changelog

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -sSL https://github.com/orhun/git-cliff/releases/latest/download/git-cliff-linux-amd64.tar.gz \
          | tar -xz
          sudo mv git-cliff /usr/local/bin/git-cliff

      - name: Generate CHANGELOG.md
        run: |
          git-cliff --config cliff.toml --tag ${{ github.ref_name }} --output CHANGELOG.md
